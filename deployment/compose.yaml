services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeroon}
      POSTGRES_USER: ${POSTGRES_USER:-zeroon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Bind localhost only: safe on cloud, still usable for local host tooling.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zeroon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeroon} -d ${POSTGRES_DB:-zeroon}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - zeroon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # Pre-build and load this image on the server (amd64):
    #   docker build --platform linux/amd64 -t zeroon-backend:latest ../backend
    #   docker save zeroon-backend:latest | gzip > zeroon-backend.tar.gz
    image: zeroon-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zeroon}
      POSTGRES_USER: ${POSTGRES_USER:-zeroon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ZEROON_ACCESS_TOKEN_SECRET: ${ZEROON_ACCESS_TOKEN_SECRET:?ZEROON_ACCESS_TOKEN_SECRET is required}
      ZEROON_ACCESS_TOKEN_TTL_MINUTES: ${ZEROON_ACCESS_TOKEN_TTL_MINUTES:-30}
      ZEROON_REFRESH_TOKEN_TTL_DAYS: ${ZEROON_REFRESH_TOKEN_TTL_DAYS:-30}
      ZEROON_SMS_ENABLED: ${ZEROON_SMS_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      ZEROON_LLM_PROVIDER: ${ZEROON_LLM_PROVIDER:-openai-compatible}
      ZEROON_LLM_MODEL: ${ZEROON_LLM_MODEL:?ZEROON_LLM_MODEL is required}
      ZEROON_LLM_TIMEOUT_SECONDS: ${ZEROON_LLM_TIMEOUT_SECONDS:-10}
      ZEROON_SMTP_HOST: ${ZEROON_SMTP_HOST:?ZEROON_SMTP_HOST is required}
      ZEROON_SMTP_PORT: ${ZEROON_SMTP_PORT:-587}
      ZEROON_SMTP_USERNAME: ${ZEROON_SMTP_USERNAME:?ZEROON_SMTP_USERNAME is required}
      ZEROON_SMTP_PASSWORD: ${ZEROON_SMTP_PASSWORD:?ZEROON_SMTP_PASSWORD is required}
      ZEROON_EMAIL_FROM: ${ZEROON_EMAIL_FROM:?ZEROON_EMAIL_FROM is required}
      ZEROON_SMTP_SSL_ENABLED: ${ZEROON_SMTP_SSL_ENABLED:-false}
      ZEROON_SMTP_STARTTLS_ENABLED: ${ZEROON_SMTP_STARTTLS_ENABLED:-true}
      ZEROON_EVIDENCE_INGESTION_ENABLED: ${ZEROON_EVIDENCE_INGESTION_ENABLED:-true}
      ZEROON_EVIDENCE_NOTICE_VERSION: ${ZEROON_EVIDENCE_NOTICE_VERSION:-beta-evidence-v2}
      ZEROON_EVIDENCE_RETENTION_DAYS: ${ZEROON_EVIDENCE_RETENTION_DAYS:-180}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    # Backend stays internal; public traffic must enter through an HTTPS ingress.
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt/config:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/certbot:ro
      - ../admin/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  zeroon_postgres:
  zeroon_redis:
